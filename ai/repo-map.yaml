repository:
  name: genealogy-v2
  stage: asset-baseline
  language: zh-CN

read_first:
  - AGENTS.md
  - docs/agents/skill-routing.md
  - product/README.md
  - domains/README.md
  - domains/glossary.yaml
  - domains/context-map.yaml

sources_of_truth:
  product: product/
  domain: domains/
  active_change: changes/active/
  decisions: decisions/
  verification: evals/
  execution_skills: skills/engineering/
  implementation_knowledge: knowledge/

skill_integration:
  upstream_source: skills/upstream/mattpocock/source.yaml
  requirement_route: ai/routing/requirement-development.yaml
  context_pack: ai/context-packs/requirement-development.yaml
  precedence: ai/policies/skill-precedence.md

reference_only:
  - reference/
  - skills/upstream/

rules:
  - read the active change context before modifying assets
  - prefer the smallest sufficient context pack
  - do not treat reference materials as approved requirements
  - do not create new domain concepts without an approved change
  - update verification assets with every behavior change
  - project-adapted skills override upstream skills with the same name
