id: requirement-development
purpose: minimum context for requirement design and implementation

required:
  - AGENTS.md
  - ai/repo-map.yaml
  - domains/glossary.yaml
  - domains/context-map.yaml
  - changes/active/{change-id}/change.yaml
  - changes/active/{change-id}/context.md

conditional:
  product:
    - product/vision.md
    - product/capability-map.yaml
  affected_domains:
    - domains/{domain}/manifest.yaml
    - domains/{domain}/AGENTS.md
    - domains/{domain}/README.md
    - domains/{domain}/model/
    - domains/{domain}/rules/
    - domains/{domain}/evals/
  implementation:
    - knowledge/curated/
    - knowledge/generated/
  decisions:
    - decisions/

completion_context:
  - changes/active/{change-id}/tasks.md
  - changes/active/{change-id}/implementation/
  - changes/active/{change-id}/validation/
  - changes/active/{change-id}/evidence/
