rules:
  - every capability has a stable id, name, description, priority, domain, target_release, status and depends_on
  - priority uses P0 for release-critical, P1 for important enhancement and P2 for later or experimental scope
  - status uses candidate, planned, in-progress, delivered or deprecated
  - dependencies reference capability ids and must not form a cycle
  - implementation details, interfaces and database structures do not belong here
  - capability changes must be introduced through an approved product Change
