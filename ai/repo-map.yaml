repository:
  name: genealogy-v2
  stage: ai-engineering-baseline
  language: zh-CN

read_first:
  - AGENTS.md
  - ai/routing/requirement-development.yaml
  - product/README.md
  - domains/README.md
  - domains/glossary.yaml
  - domains/context-map.yaml

sources_of_truth:
  product: product/
  domain: domains/
  active_change: changes/active/
  decisions: decisions/
  verification: evals/
  execution_skills: skills/catalog.yaml
  implementation_knowledge: knowledge/
  repository_schemas: schemas/repository/

compatibility_only:
  - docs/agents/

reference_only:
  - reference/
  - skills/upstream/

rules:
  - read change.yaml and context.md before modifying a non-trivial change
  - prefer the smallest sufficient context pack
  - canonical assets override provisional and reference assets
  - update validation assets with every behavior change
  - project-adapted skills override upstream skills with the same name
  - run tools/validate_repo.py before declaring completion
