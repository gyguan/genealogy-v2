version: 2
status: approved
updated_at: 2026-08-04

release_definitions:
  - id: V0.1
    name: 基础谱系模型验证版
    goal: 建立人物、普通家庭关系、谱系组织与基础世系查询闭环
  - id: V0.2
    name: 资料采集与审核版
    goal: 支持修谱团队按支房户分工采集并完成多级审核
  - id: V0.3
    name: 中国式复杂谱系版
    goal: 正确表达复杂亲属、谱籍承继、字辈和历史时空语义
  - id: V0.4
    name: 证据与质量治理版
    goal: 建立来源、主张、证据、审核、正式事实和质量治理闭环
  - id: V0.5
    name: 谱书编修与出版版
    goal: 从结构化事实生成可评审、可冻结、可交付的谱书版本
  - id: V1.0
    name: 首个可商用版本
    goal: 完成一部真实族谱从项目创建到数据与谱书交付的端到端过程
  - id: V1.1
    name: 旧谱数字化版
    goal: 支持扫描件、OCR、结构抽取、校对和批量入库
  - id: V1.2
    name: 专业机构运营版
    goal: 支持专业修谱机构多项目运营、模板复用和商业交付
  - id: V2.0
    name: 平台与生态版
    goal: 支持跨谱协作、专家服务和受控AI辅助

