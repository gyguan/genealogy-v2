definitions:
  - id: FLOW-GOV-MIN-001
    kind: flow
    section: 方案概览
    summary: PR 先执行确定性校验和当前 Change 注册测试，再完成 Codex 与按 Profile 分级的人类评审
    basis: [FACT-GOV-MIN-001, FACT-GOV-MIN-003, FACT-GOV-MIN-004]
    specs: [SPEC-GOV-MIN-001, SPEC-GOV-MIN-004, SPEC-GOV-MIN-005]
    tests: [TEST-GOV-MIN-TRACE-001]
  - id: MODULE-GOV-MIN-001
    kind: module
    section: 接口与模块边界
    summary: run_change_tests.py 解析当前 PR Change 并在无凭证环境执行白名单测试命令
    basis: [FACT-GOV-MIN-001, ASM-GOV-MIN-001, SPEC-GOV-MIN-001]
    specs: [SPEC-GOV-MIN-001]
    tests: [TEST-GOV-MIN-001]
  - id: MODULE-GOV-MIN-002
    kind: module
    section: 接口与模块边界
    summary: validate_pr_change_strict.py 比较实际 Domain Decision Capability 与声明范围
    basis: [FACT-GOV-MIN-002, SPEC-GOV-MIN-002]
    specs: [SPEC-GOV-MIN-002]
    tests: [TEST-GOV-MIN-002]
  - id: MODULE-GOV-MIN-003
    kind: module
    section: 接口与模块边界
    summary: strict Change 与 machine Design 校验器阻断评审态模板占位 ID
    basis: [SPEC-GOV-MIN-003]
    specs: [SPEC-GOV-MIN-003]
    tests: [TEST-GOV-MIN-003]
  - id: MODULE-GOV-MIN-004
    kind: module
    section: 接口与模块边界
    summary: validate_pr.py 根据声明 Change Profile 对 high-risk 增加当前 Head 人类批准要求
    basis: [FACT-GOV-MIN-003, SPEC-GOV-MIN-004]
    specs: [SPEC-GOV-MIN-004]
    tests: [TEST-GOV-MIN-004]
  - id: MIG-GOV-MIN-001
    kind: migration
    section: 迁移方案
    summary: Release Evidence 改为绑定最终 PR Head 和校验结果而非合入前 Merge SHA
    basis: [FACT-GOV-MIN-004, SPEC-GOV-MIN-005]
    specs: [SPEC-GOV-MIN-005]
    tests: [TEST-GOV-MIN-005]
  - id: SEC-GOV-MIN-001
    kind: security
    section: 安全与隐私
    summary: 注册测试子进程使用最小环境隔离 Token 且 high-risk 只接受非作者人类批准
    basis: [FACT-GOV-MIN-003, SPEC-GOV-MIN-001, SPEC-GOV-MIN-004]
    specs: [SPEC-GOV-MIN-001, SPEC-GOV-MIN-004]
    tests: [TEST-GOV-MIN-SEC-001]
  - id: TRACE-GOV-MIN-001
    kind: traceability
    section: 测试 Seam
    summary: 每项必要门禁和 Release 简化都有注册测试并由当前 PR 测试执行器真实运行
    basis: [SPEC-GOV-MIN-001, SPEC-GOV-MIN-002, SPEC-GOV-MIN-003, SPEC-GOV-MIN-004, SPEC-GOV-MIN-005]
    specs: [SPEC-GOV-MIN-001, SPEC-GOV-MIN-002, SPEC-GOV-MIN-003, SPEC-GOV-MIN-004, SPEC-GOV-MIN-005]
    tests: [TEST-GOV-MIN-TRACE-001]
