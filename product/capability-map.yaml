rules:
- every capability has a stable id, name, description, capability_type, primary_domain, supporting_domains, target_release,
  release_priority, status, planning_confidence and depends_on
- capability_type uses business, application or platform; platform capabilities also declare platform_area
- primary_domain is product responsibility and does not by itself authorize code ownership or direct data access
- release_priority uses must, should or could within the target release
- status uses candidate, planned, in-progress, delivered or deprecated
- dependencies reference capability ids, must not form a cycle and must not point to a later release
- implementation details, interfaces and database structures do not belong in product capability assets
- capability changes must be introduced through an approved product Change
